# Runs CI tests and generates wheels on the following platforms:
# * Linux
# * macOS
# * Windows
#
# Useful URLs:
# * https://github.com/pypa/cibuildwheel
# * https://github.com/actions/checkout
# * https://github.com/actions/setup-python
# * https://github.com/actions/upload-artifact

on: [push, pull_request]
name: build
concurrency:
  # Cancel build if a new one starts, but don't interrupt all jobs on the first
  # failure.
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:

  # Run tests on Linux, macOS, Windows
  tests:
    name: "${{ matrix.os }}, ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: self-hosted, arch: ppc64le }
          - { os: macos-15, arch: x86_64 }
          - { os: macos-15, arch: arm64 }
          - { os: windows-2025, arch: AMD64 }
          - { os: windows-11-arm, arch: ARM64 }
    steps:
      - uses: actions/checkout@v5

      # Install Python 3.8 on macOS ARM64 for universal2 support, else 3.11
      - if: ${{ matrix.os != 'self-hosted' }}
        name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' && '3.8' || '3.11' }}
      - if: ${{ matrix.os == 'self-hosted'}}
        name: Set up Python (self-hosted)
        uses: IBM/setup-python-pz@4ca38bfac8eac147e9c7aad9ab246f68655afb36
        with:
          python-version: 3.11
          architecture: ppc64le

      - name: Build wheels + run tests
        if: ${{ matrix.os != 'self-hosted'}}
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS: "${{ matrix.arch }}"
          CIBW_ENABLE: "cpython-freethreading ${{ startsWith(github.ref, 'refs/tags/') && '' || 'cpython-prerelease' }}"

      - name: Build wheels for ppc64le
        if: ${{ matrix.os == 'self-hosted' }}
        env:
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_FREE_THREADED_SUPPORT: True
          CIBW_ARCHS: "ppc64le"
          CIBW_BUILD: "cp311-manylinux_ppc64le"
          CIBW_CONTAINER_ENGINE: podman
          CIBW_CONTAINER_PRIVILEGED: true
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-dev python3.12-venv
          sudo update-alternatives --install /usr/bin/python python3 /usr/bin/python3.12 1
          python3 --version
          export PATH=$HOME/.local/bin:$PATH
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install cibuildwheel
          cibuildwheel

  # Run linters and build doc.
  linters-and-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: "Run linters"
        run: |
          make ci-lint
      - name: "Build doc"
        run: |
          pip install -r docs/requirements.txt
          cd docs && make html

  # Merge wheels and check sanity of the package distribution.
  merge-and-check-dist:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/upload-artifact/merge@v4
        with:
          name: wheels
          pattern: wheels-*
          separate-directories: false
          delete-merged: true
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse
      - run: |
          make ci-check-dist
